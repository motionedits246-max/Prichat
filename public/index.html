<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#070809" />
    <meta
      name="description"
      content="Private temporary conversations with no-signup person codes."
    />
    <title>PriChat — Messages</title>
    <link rel="icon" href="/mark.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main id="workspace" class="workspace">
      <nav class="rail" aria-label="Workspace">
        <div class="rail-start">
          <button
            class="brand-glyph"
            data-action="inbox"
            aria-label="PriChat home"
          >
            <i data-icon="message"></i>
          </button>
          <button
            class="compose-key"
            data-action="new"
            aria-label="New conversation"
            title="New conversation"
          >
            <i data-icon="pencil"></i>
          </button>
        </div>
        <div class="rail-dock">
          <button
            data-action="inbox"
            class="nav-current"
            aria-label="Messages"
            title="Messages"
          >
            <i data-icon="message"></i>
          </button>
          <button
            data-action="discussions"
            aria-label="Discussions"
            title="Discussions"
          >
            <i data-icon="users"></i>
          </button>
          <button
            data-action="invitations"
            aria-label="Invitations"
            title="Invitations"
          >
            <i data-icon="bell"></i>
            <span id="inviteDot" hidden></span>
          </button>
          <button data-action="privacy" aria-label="Privacy" title="Privacy">
            <i data-icon="shield"></i>
          </button>
          <button data-action="settings" aria-label="Settings" title="Settings">
            <i data-icon="settings"></i>
          </button>
        </div>
      </nav>
      <aside id="chatSide" class="sidebar" aria-label="Conversation sidebar">
        <header class="sidebar-tools">
          <button
            id="profileTop"
            class="round profile-top"
            aria-label="Your identity"
            title="Your identity"
          >
            <span class="avatar noir"></span>
            <span class="online-dot" id="selfDot" hidden></span>
          </button>
          <button class="brand-pill" data-action="inbox">
            <i data-icon="message"></i>
            PriChat
          </button>
          <button
            class="round"
            id="searchToggle"
            aria-label="Search conversations"
            title="Search conversations"
            aria-expanded="false"
            aria-controls="searchRow"
          >
            <i data-icon="search"></i>
          </button>
          <button
            class="round"
            id="menuToggle"
            aria-label="Inbox options"
            title="Inbox options"
            aria-expanded="false"
            aria-controls="inboxMenu"
          >
            <i data-icon="chevron-down"></i>
          </button>
        </header>
        <div class="popover" id="inboxMenu" hidden>
          <button data-action="new">
            <i data-icon="square-pen"></i>
            New conversation
          </button>
          <button data-action="inbox">
            <i data-icon="message"></i>
            All messages
          </button>
          <button data-action="directs">
            <i data-icon="user"></i>
            Direct chats
          </button>
          <button data-action="discussions">
            <i data-icon="users"></i>
            Discussions
          </button>
          <button data-action="settings">
            <i data-icon="settings"></i>
            Settings
          </button>
          <button data-action="code">
            <i data-icon="copy"></i>
            My person code
          </button>
          <button data-action="privacy">
            <i data-icon="shield"></i>
            Privacy
          </button>
        </div>
        <div id="searchRow" class="search-row" hidden>
          <i data-icon="search"></i>
          <input
            id="findRoom"
            type="search"
            autocomplete="off"
            placeholder="Search conversations"
            aria-label="Search by room name or message"
          />
          <button class="mini-icon" id="clearSearch" aria-label="Close search">
            <i data-icon="x"></i>
          </button>
        </div>
        <div class="orbit-strip" aria-label="Room shortcuts">
          <button class="orbit" data-action="profile">
            <span class="orbit-face">
              <span class="avatar noir"></span>
              <span class="orbit-marker"><i data-icon="pencil"></i></span>
            </span>
            <span id="orbitName">My identity</span>
          </button>
          <button class="orbit" data-action="direct">
            <span class="orbit-face blue-ring">
              <span class="avatar azure"></span>
            </span>
            <span>Direct chat</span>
          </button>
          <button class="orbit" data-action="group">
            <span class="orbit-face violet-ring">
              <span class="avatar violet"></span>
            </span>
            <span>Discussion</span>
          </button>
        </div>
        <div class="inbox-title">
          <h1 id="listTitle">Messages</h1>
          <p id="listCaption">Start a conversation</p>
        </div>
        <div id="invitations" hidden></div>
        <div class="list-scroll">
          <div id="roomList" class="room-list"></div>
          <div id="starterRows" class="room-list">
            <button class="room-row" data-action="direct">
              <span class="list-face starter-face">
                <span class="avatar azure"></span>
                <i data-icon="message"></i>
              </span>
              <span class="details">
                <strong>Message a person</strong>
                <small>Connect with a person code</small>
              </span>
              <i data-icon="chevron-right"></i>
            </button>
            <button class="room-row" data-action="group">
              <span class="list-face starter-face">
                <span class="avatar violet"></span>
                <i data-icon="users"></i>
              </span>
              <span class="details">
                <strong>Create a discussion</strong>
                <small>Open a private group room</small>
              </span>
              <i data-icon="chevron-right"></i>
            </button>
            <button class="room-row" data-action="join">
              <span class="list-face starter-face">
                <span class="avatar noir"></span>
                <i data-icon="link"></i>
              </span>
              <span class="details">
                <strong>Join with a link</strong>
                <small>Open a one-use room invitation</small>
              </span>
              <i data-icon="chevron-right"></i>
            </button>
          </div>
        </div>
      </aside>
      <aside
        class="sidebar settings-side"
        id="settingsSide"
        aria-label="Settings"
        hidden
      ></aside>
      <section class="conversation" id="conversation" aria-label="Conversation">
        <section
          id="detailPane"
          class="detail-pane"
          aria-label="Settings detail"
          hidden
        ></section>
        <div id="emptyChat" class="empty-chat">
          <div class="empty-mark"><i data-icon="message"></i></div>
          <h2>
            PriChat
            <span class="desktop-text">for desktop</span>
          </h2>
          <p id="emptyCopy">Choose a name to start messaging privately.</p>
          <button data-action="enter" class="primary compact" id="begin">
            Choose a name
          </button>
        </div>
        <section id="entry" class="entry" hidden>
          <form id="identityForm">
            <div class="entry-head">
              <span class="portrait-lg avatar noir"></span>
              <button
                type="button"
                class="round small"
                data-action="inbox"
                aria-label="Back to messages"
              >
                <i data-icon="x"></i>
              </button>
            </div>
            <h2>Your identity</h2>
            <p class="muted">Choose the name people see in your chats.</p>
            <label class="field-label" for="name">Display name</label>
            <input
              class="text-input"
              id="name"
              placeholder="Your name"
              required
              maxlength="32"
              autocomplete="off"
              spellcheck="false"
            />
            <fieldset class="choices">
              <legend class="sr-only">Identity duration</legend>
              <label>
                <input type="radio" name="mode" value="temporary" checked />
                <i data-icon="hourglass"></i>
                Temporary
              </label>
              <label>
                <input type="radio" name="mode" value="saved" />
                <i data-icon="bookmark"></i>
                Keep on device
              </label>
            </fieldset>
            <p class="helper" id="modeHint">
              Your person code lasts for this session.
            </p>
            <button class="primary" id="enterBtn">
              <span>Create my person code</span>
            </button>
            <p class="form-error" id="entryError" role="alert"></p>
          </form>
        </section>
        <div id="roomPanel" class="room-panel" hidden>
          <header class="room-head">
            <button
              class="round"
              data-action="inbox"
              aria-label="Back to conversations"
            >
              <i data-icon="back"></i>
            </button>
            <button
              class="chat-contact"
              id="roomInfo"
              aria-label="Room details"
            >
              <span class="avatar azure" id="headAvatar"></span>
              <span class="details">
                <strong id="roomTitle"></strong>
                <small id="roomSub"></small>
              </span>
            </button>
            <button
              id="inviteBtn"
              class="round"
              aria-label="Invite to room"
              title="Invite"
            >
              <i data-icon="user-plus"></i>
            </button>
            <button
              id="leaveBtn"
              class="round"
              aria-label="Close room for everyone"
              title="Leave room"
            >
              <i data-icon="exit"></i>
            </button>
          </header>
          <div
            class="thread"
            role="log"
            aria-label="Messages"
            id="thread"
          ></div>
          <div class="compose-wrap">
            <div
              id="attachmentMenu"
              class="attachment-menu"
              role="menu"
              aria-label="Add to chat"
              hidden
            ></div>
            <form class="composer" id="composer">
              <button
                id="attachToggle"
                class="compose-plus"
                aria-haspopup="menu"
                aria-controls="attachmentMenu"
                aria-expanded="false"
                type="button"
                data-action="room-actions"
                aria-label="Add to chat"
                title="Add to chat"
              >
                <i data-icon="plus"></i>
              </button>
              <button
                class="compose-emoji"
                type="button"
                data-action="emoji"
                aria-label="Choose emoji"
              >
                <i data-icon="smile"></i>
              </button>
              <input
                id="draft"
                maxlength="1500"
                aria-label="Message"
                autocomplete="off"
                placeholder="Message this room…"
              />
              <button
                class="send"
                id="sendBtn"
                aria-label="Send message"
                disabled
              >
                <span class="send-arrow"><i data-icon="send"></i></span>
                <span class="send-check"><i data-icon="check"></i></span>
                <span class="send-error">
                  <i data-icon="triangle-alert"></i>
                </span>
                <progress
                  id="sendProgress"
                  max="1"
                  aria-hidden="true"
                  hidden
                ></progress>
              </button>
            </form>
            <span
              class="sr-only"
              role="status"
              aria-live="polite"
              id="sendStatus"
            ></span>
          </div>
        </div>
      </section>
    </main>
    <dialog id="modal" aria-labelledby="modalTitle">
      <div class="modal-top">
        <span class="modal-icon" id="modalIcon"></span>
        <button class="round small" id="dismiss" aria-label="Close dialog">
          <i data-icon="x"></i>
        </button>
      </div>
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
    </dialog>
    <div class="toast" id="toast" role="status" hidden></div>
  </body>
</html>
